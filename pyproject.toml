[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vhc-monitor"
version = "0.2.0"
description = "Veeam Health Check monitoring toolkit"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25",
    "typer[all]>=0.9",
    "pyyaml>=6.0",
    "prometheus_client>=0.19",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "respx>=0.20",
    "pytest-asyncio>=0.21",
    "pyinstaller>=6.0",
]

[project.scripts]
vhc-monitor = "vhc_monitor.cli:app"

[tool.setuptools.packages.find]
include = ["vhc_monitor*"]
