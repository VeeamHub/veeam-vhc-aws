name: Security Scan

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, master]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Vulnerable Package Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore src/VeeamVhcAws/VeeamVhcAws.csproj

      - name: Check for vulnerable packages
        run: |
          dotnet list src/VeeamVhcAws/VeeamVhcAws.csproj package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
          cat vuln-report.txt
          if grep -q "has the following vulnerable packages" vuln-report.txt; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          extra_args: --only-verified

  plaintext-credentials:
    name: Plaintext Credential Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # TruffleHog and gitleaks both detect high-entropy provider tokens. Neither
      # matches a human-chosen password in a `password:` field, which is how
      # veeam-monitor.yaml stayed in this repo undetected. This gate covers that
      # class specifically: a literal credential assigned in a tracked config file.
      # Allowed values are empty, ${VAR}, ${{ expr }}, {{ template }}, <placeholder>, null, ~.
      - name: Scan tracked config files for literal credentials
        run: |
          hits=$(git grep -nIE '^[[:space:]]*(password|passwd|secret|api[_-]?key|apikey|token|bind_?password)[[:space:]]*:[[:space:]]*[^[:space:]]' \
                  -- '*.yaml' '*.yml' '*.json' '*.toml' '*.config' '*.xml' 2>/dev/null \
                | grep -vE ':[[:space:]]*("" *|'"''"' *|\$\{\{.*\}\}|\$\{[^}]*\}|\{\{.*\}\}|<[^>]*>|null|~)[[:space:]]*,?[[:space:]]*$' || true)
          if [ -n "$hits" ]; then
            echo "$hits" | sed -E 's/(:[[:space:]]*).*/\1<redacted>/'
            echo "::error::Literal credential found in a tracked config file. Use an env var or an empty placeholder."
            exit 1
          fi
          echo "clean: no literal credentials in tracked config files"
