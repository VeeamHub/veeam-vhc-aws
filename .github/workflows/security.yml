name: Security Scan

on:
  push:
    branches: [dev]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Vulnerable Package Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore src/VeeamVhcAws/VeeamVhcAws.csproj

      - name: Check for vulnerable packages
        run: |
          dotnet list src/VeeamVhcAws/VeeamVhcAws.csproj package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
          cat vuln-report.txt
          if grep -q "has the following vulnerable packages" vuln-report.txt; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
