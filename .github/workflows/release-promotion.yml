name: Release Promotion

# dev is the default branch, so fixes land there. Nothing surfaced when dev
# stopped reaching master, and a security fix sat unshipped for 15 days across
# two separate PRs. This keeps exactly one dev -> master PR open whenever dev
# is ahead, so the unshipped gap is always visible and one click from merging.
#
# A repository with no master branch cannot promote. Ask the remote before
# rev-list and skip the promotion steps instead of failing. When master
# exists, those steps are unchanged.

on:
  push:
    branches: [dev]
  schedule:
    - cron: '0 13 * * 1'  # Weekly Monday 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  promote:
    name: Keep release PR current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check whether origin has master
        id: master
        run: |
          # Exit 2 means the remote has no master ref. Any other failure
          # still fails the job, so a real master is never treated as missing.
          master_status=0
          git ls-remote --exit-code --heads origin master >/dev/null || master_status=$?
          if [ "$master_status" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$master_status" -eq 2 ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "origin has no master branch. Skipping the remaining promotion steps."
            echo "::notice title=Release promotion skipped::origin has no master branch. Skipping the remaining promotion steps."
            exit 0
          fi
          echo "Could not query origin for the master branch (git ls-remote exited ${master_status})."
          exit "$master_status"

      - name: Open or refresh the dev -> master PR
        if: steps.master.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ahead=$(git rev-list --count origin/master..origin/dev)
          if [ "$ahead" -eq 0 ]; then
            echo "dev is level with master; nothing to promote"
            exit 0
          fi
          existing=$(gh pr list --base master --head dev --state open --json number -q '.[0].number')
          body=$(printf 'dev is **%s commit(s)** ahead of master.\n\nMerging cuts a signed release via release.yml.\n\n%s' \
                   "$ahead" "$(git log --pretty='- %s' origin/master..origin/dev | head -30)")
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "Release: promote dev to master ($ahead commit(s))" --body "$body"
            echo "refreshed PR #$existing"
          else
            gh pr create --base master --head dev \
              --title "Release: promote dev to master ($ahead commit(s))" --body "$body"
          fi
