name: Release Promotion

# dev is the default branch, so fixes land there. Nothing surfaced when dev
# stopped reaching master, and a security fix sat unshipped for 15 days across
# two separate PRs. This keeps exactly one dev -> master PR open whenever dev
# is ahead, so the unshipped gap is always visible and one click from merging.

on:
  push:
    branches: [dev]
  schedule:
    - cron: '0 13 * * 1'  # Weekly Monday 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  promote:
    name: Keep release PR current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Open or refresh the dev -> master PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ahead=$(git rev-list --count origin/master..origin/dev)
          if [ "$ahead" -eq 0 ]; then
            echo "dev is level with master; nothing to promote"
            exit 0
          fi
          existing=$(gh pr list --base master --head dev --state open --json number -q '.[0].number')
          body=$(printf 'dev is **%s commit(s)** ahead of master.\n\nMerging cuts a signed release via release.yml.\n\n%s' \
                   "$ahead" "$(git log --pretty='- %s' origin/master..origin/dev | head -30)")
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "Release: promote dev to master ($ahead commit(s))" --body "$body"
            echo "refreshed PR #$existing"
          else
            gh pr create --base master --head dev \
              --title "Release: promote dev to master ($ahead commit(s))" --body "$body"
          fi
