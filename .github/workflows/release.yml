name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # Gate: run all validation before releasing
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v

  security:
    name: Security Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          pip install pip-audit bandit[toml] .
          pip freeze --exclude vhc-monitor --exclude pip-audit --exclude bandit > requirements-audit.txt

      - name: Dependency audit
        run: pip-audit --strict --desc -r requirements-audit.txt

      - name: Bandit SAST
        run: bandit -r vhc_monitor/ -f screen

  # Build and release
  release:
    name: Build & Release
    runs-on: windows-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install .
          pip install pyinstaller

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "from vhc_monitor import __version__; print(__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build executable
        run: pyinstaller vhc-monitor.spec --noconfirm

      - name: VirusTotal Scan
        if: env.VT_API_KEY != ''
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: dist/vhc-monitor.exe
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}

      - name: Check if release exists
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/vhc-monitor.exe \
            setup.ps1 \
            config/example.yaml \
            --title "vhc-monitor ${{ steps.version.outputs.tag }}" \
            --generate-notes

      - name: Upload to existing release
        if: steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            dist/vhc-monitor.exe \
            setup.ps1 \
            config/example.yaml \
            --clobber
