name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  # Gate: run all validation before releasing
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v

  security:
    name: Security Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          pip install pip-audit bandit[toml] .
          pip freeze --exclude vhc-monitor --exclude pip-audit --exclude bandit > requirements-audit.txt

      - name: Dependency audit
        run: pip-audit --strict --desc -r requirements-audit.txt

      - name: Bandit SAST
        run: bandit -r vhc_monitor/ -f screen --skip B105,B107,B404,B603,B607

  # Build and release
  release:
    name: Build & Release
    runs-on: windows-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install .
          pip install pyinstaller

      - name: Set version
        id: version
        shell: bash
        run: |
          # Base version from code + run number for unique, auto-incrementing releases
          BASE=$(python -c "from vhc_monitor import __version__; print(__version__)")
          VERSION="${BASE}.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Build executable
        run: pyinstaller vhc-monitor.spec --noconfirm

      - name: Bundle release zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-bundle -Force | Out-Null
          Copy-Item dist/vhc-monitor.exe release-bundle/
          Copy-Item setup.ps1 release-bundle/
          Copy-Item config/example.yaml release-bundle/
          @"
          # vhc-monitor ${{ steps.version.outputs.tag }}

          ## Quick Start

          1. Run setup (creates config + scheduled task):

              .\setup.ps1 -AlertUrl "https://ntfy.example.com/veeam-alerts"

          2. Or manually configure:

              Copy example.yaml to vhc-monitor.yaml
              Edit with your server details
              .\vhc-monitor.exe all -c vhc-monitor.yaml

          ## First Time?

          Just double-click vhc-monitor.exe — it will guide you.

          ## Commands

              vhc-monitor.exe setup                        Create config file
              vhc-monitor.exe all -c vhc-monitor.yaml      Run all monitors
              vhc-monitor.exe test-connection -c config     Test server connectivity
              vhc-monitor.exe serve -c config -p 9100       Prometheus metrics server
              vhc-monitor.exe --help                        Show all commands

          ## Docs

          https://github.com/VeeamHub/veeam-vhc-monitor
          "@ | Out-File -FilePath release-bundle/README.txt -Encoding utf8
          Compress-Archive -Path release-bundle/* -DestinationPath "vhc-monitor-${{ steps.version.outputs.tag }}-windows.zip"

      - name: VirusTotal Scan
        if: env.VT_API_KEY != ''
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: dist/vhc-monitor.exe
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "vhc-monitor-${{ steps.version.outputs.tag }}-windows.zip" \
            dist/vhc-monitor.exe \
            --title "vhc-monitor ${{ steps.version.outputs.tag }}" \
            --generate-notes
