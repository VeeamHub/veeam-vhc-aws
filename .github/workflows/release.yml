name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore & Test
        run: |
          dotnet restore src/VeeamVhcAws/VeeamVhcAws.csproj
          dotnet test tests/VeeamVhcAws.Tests/VeeamVhcAws.Tests.csproj -c Release -v normal

  security:
    name: Security Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore src/VeeamVhcAws/VeeamVhcAws.csproj

      - name: Vulnerable package check
        run: |
          dotnet list src/VeeamVhcAws/VeeamVhcAws.csproj package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
          if grep -q "has the following vulnerable packages" vuln-report.txt; then
            echo "::error::Vulnerable NuGet packages detected — review vuln-report.txt"
            exit 1
          fi

  release:
    name: Build & Release
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Get version
        id: version
        run: |
          BASE=$(grep -oP '(?<=<Version>)[^<]+' src/VeeamVhcAws/VeeamVhcAws.csproj)
          VERSION="${BASE}.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Publish win-x64
        run: |
          dotnet publish src/VeeamVhcAws/VeeamVhcAws.csproj \
            -c Release \
            -r win-x64 \
            --self-contained \
            -p:Version=${{ steps.version.outputs.version }} \
            -o dist/win-x64 \
            --nologo

      - name: Sign exe (Azure Trusted Signing)
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: vadamc
          certificate-profile-name: vadamc-github
          files-folder: dist/win-x64
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify single-file output
        run: |
          ls -lh dist/win-x64/
          test -f dist/win-x64/veeam-vhc-aws.exe
          COUNT=$(ls dist/win-x64/ | wc -l)
          echo "Output file count: $COUNT (expected: 1)"
          [ "$COUNT" -eq 1 ] || echo "::warning::More than 1 file in publish output"

      - name: Bundle release zip
        run: |
          mkdir -p release-bundle
          cp dist/win-x64/veeam-vhc-aws.exe release-bundle/
          cp setup.ps1 release-bundle/
          cp config/example.yaml release-bundle/
          cat > release-bundle/README.txt << 'EOF'
          veeam-vhc-aws — Veeam VHC AWS
          =========================================

          Quick Start
          -----------
          1. Right-click setup.ps1 → Run as Administrator
             (Configures servers, notifications, and creates a scheduled task)

          2. Or run manually:
             .\veeam-vhc-aws.exe all -c veeam-vhc-aws.yaml

          Commands
          --------
          .\veeam-vhc-aws.exe setup                        Interactive config wizard
          .\veeam-vhc-aws.exe all -c veeam-vhc-aws.yaml      Run all monitors
          .\veeam-vhc-aws.exe summary -c veeam-vhc-aws.yaml  Daily summary
          .\veeam-vhc-aws.exe test-connection -c config    Test server connectivity
          .\veeam-vhc-aws.exe serve -c config -p 9100      Prometheus metrics server
          .\veeam-vhc-aws.exe --help                       Show all commands

          Docs: https://github.com/VeeamHub/veeam-veeam-vhc-aws
          EOF
          zip -j "veeam-vhc-aws-${{ steps.version.outputs.tag }}-windows.zip" release-bundle/*
          echo "--- Zip contents ---"
          unzip -l "veeam-vhc-aws-${{ steps.version.outputs.tag }}-windows.zip"

      - name: Check VT API key configured
        run: |
          if [ -z "$VT_API_KEY" ]; then
            echo "::warning::VT_API_KEY secret not set — VirusTotal scan will be skipped. Configure the secret for release scanning."
          fi
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}

      - name: VirusTotal Scan
        id: virustotal
        if: env.VT_API_KEY != ''
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          SHA256=$(sha256sum dist/win-x64/veeam-vhc-aws.exe | awk '{print $1}')
          VT_URL="https://www.virustotal.com/gui/file/$SHA256"
          echo "vt_url=$VT_URL" >> "$GITHUB_OUTPUT"
          echo "VT report URL: $VT_URL"

          UPLOAD=$(curl -s --request POST \
            --url https://www.virustotal.com/api/v3/files \
            --header "x-apikey: $VT_API_KEY" \
            --form file=@dist/win-x64/veeam-vhc-aws.exe)
          ANALYSIS_ID=$(echo "$UPLOAD" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['id'])")
          echo "Analysis ID: $ANALYSIS_ID"

          for i in $(seq 1 20); do
            sleep 30
            RESULT=$(curl -s --request GET \
              --url "https://www.virustotal.com/api/v3/analyses/$ANALYSIS_ID" \
              --header "x-apikey: $VT_API_KEY")
            STATUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['attributes']['status'])")
            echo "[$i/20] Status: $STATUS"
            if [ "$STATUS" = "completed" ]; then
              MALICIOUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['attributes']['stats']['malicious'])")
              echo "malicious=$MALICIOUS" >> "$GITHUB_OUTPUT"
              echo "Malicious: $MALICIOUS | Report: $VT_URL"
              if [ "$MALICIOUS" -gt 5 ]; then
                echo "::error::VirusTotal flagged $MALICIOUS engines as malicious. Review: $VT_URL"
                exit 1
              fi
              echo "VT scan passed."
              exit 0
            fi
          done
          echo "::warning::VirusTotal analysis did not complete within 10 minutes — proceeding."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "veeam-vhc-aws-${{ steps.version.outputs.tag }}-windows.zip" \
            --title "veeam-vhc-aws ${{ steps.version.outputs.tag }}" \
            --generate-notes

          VT_URL="${{ steps.virustotal.outputs.vt_url }}"
          VT_COUNT="${{ steps.virustotal.outputs.malicious }}"
          if [ -n "$VT_URL" ]; then
            CURRENT=$(gh release view "${{ steps.version.outputs.tag }}" --json body -q .body)
            printf '%s\n\n**VirusTotal scan:** %s (%s malicious detections)\n' \
              "$CURRENT" "$VT_URL" "$VT_COUNT" > /tmp/release-notes.txt
            gh release edit "${{ steps.version.outputs.tag }}" --notes-file /tmp/release-notes.txt
          fi
