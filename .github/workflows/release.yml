name: Release

on:
  push:
    branches: [master]
  # Manual trigger — lets you re-cut a release (or release a chosen ref) from the Actions tab
  # without a new merge. Version stays csproj <Version> + run number, same as the push path.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore & Test
        run: |
          dotnet restore src/VeeamVhcAws/VeeamVhcAws.csproj
          dotnet test tests/VeeamVhcAws.Tests/VeeamVhcAws.Tests.csproj -c Release -v normal

  security:
    name: Security Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore src/VeeamVhcAws/VeeamVhcAws.csproj

      - name: Vulnerable package check
        run: |
          dotnet list src/VeeamVhcAws/VeeamVhcAws.csproj package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
          if grep -q "has the following vulnerable packages" vuln-report.txt; then
            echo "::error::Vulnerable NuGet packages detected — review vuln-report.txt"
            exit 1
          fi

  release:
    name: Build & Release
    runs-on: windows-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      # --- Version extraction using PowerShell (grep -oP not available on Windows) ---
      - name: Get version
        id: version
        shell: pwsh
        run: |
          $base = ([xml](Get-Content src/VeeamVhcAws/VeeamVhcAws.csproj)).Project.PropertyGroup.Version |
                  Where-Object { $_ } | Select-Object -First 1
          $version = "$base.$env:GITHUB_RUN_NUMBER"
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version"    | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release version: $version"

      - name: Publish win-x64
        shell: pwsh
        run: |
          dotnet publish src/VeeamVhcAws/VeeamVhcAws.csproj `
            -c Release `
            -r win-x64 `
            --self-contained `
            -p:Version=${{ steps.version.outputs.version }} `
            -o dist/win-x64 `
            --nologo

      # --- Azure OIDC login (exchanges GitHub token for Azure credentials) ---
      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --- Azure Trusted Signing ---
      - name: Sign exe (Azure Trusted Signing)
        uses: azure/trusted-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: vadamc
          certificate-profile-name: vadamc-github
          files-folder: dist/win-x64
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist/win-x64/veeam-vhc-aws.exe
          Write-Host "Signature status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            Write-Host "::warning::Signature status is $($sig.Status) — expected Valid"
          }

      - name: Verify publish output (exe + admin UI assets)
        shell: pwsh
        run: |
          Get-ChildItem dist/win-x64/ | Format-Table Name, Length -AutoSize
          if (-not (Test-Path dist/win-x64/veeam-vhc-aws.exe)) {
            throw "veeam-vhc-aws.exe not found in publish output"
          }
          # The Blazor admin UI (`ui` command) serves static assets from wwwroot\.
          # Without these the GUI 404s on blazor.web.js, so fail the release if absent.
          if (-not (Test-Path dist/win-x64/wwwroot/_framework/blazor.web.js)) {
            throw "wwwroot/_framework/blazor.web.js missing — the admin GUI would 404. Check PublishTrimmed/StaticWebAssetsEnabled."
          }
          Write-Host "OK: exe + wwwroot/_framework/blazor.web.js present"
          # Only the exe should be a loose file; everything else lives under wwwroot\.
          $stray = Get-ChildItem dist/win-x64/ -File | Where-Object { $_.Name -ne 'veeam-vhc-aws.exe' }
          if ($stray) {
            Write-Host "::warning::Unexpected loose files in publish output: $($stray.Name -join ', ')"
          }

      - name: Bundle release zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-bundle | Out-Null
          Copy-Item dist/win-x64/veeam-vhc-aws.exe release-bundle/
          Copy-Item dist/win-x64/wwwroot release-bundle/ -Recurse   # admin UI static assets (required by `ui`)
          Copy-Item setup.ps1 release-bundle/
          Copy-Item config/example.yaml release-bundle/
          # Single-quoted here-string: fully literal, so the backtick in `ui` is
          # not parsed as a PowerShell `u{ } Unicode escape. No interpolation needed.
          @'
          veeam-vhc-aws — Veeam VHC AWS
          =========================================

          Quick Start
          -----------
          1. Right-click setup.ps1 -> Run as Administrator
             (Configures servers, notifications, and creates a scheduled task)

          2. Or run manually:
             .\veeam-vhc-aws.exe all -c veeam-vhc-aws.yaml

          Commands
          --------
          .\veeam-vhc-aws.exe setup                        Interactive config wizard
          .\veeam-vhc-aws.exe all -c veeam-vhc-aws.yaml      Run all monitors
          .\veeam-vhc-aws.exe summary -c veeam-vhc-aws.yaml  Daily summary
          .\veeam-vhc-aws.exe ui -c veeam-vhc-aws.yaml       Launch the web admin GUI
          .\veeam-vhc-aws.exe test-connection -c config    Test server connectivity
          .\veeam-vhc-aws.exe serve -c config -p 9100      Prometheus metrics server
          .\veeam-vhc-aws.exe --help                       Show all commands

          Note: keep the wwwroot\ folder next to veeam-vhc-aws.exe -- the `ui`
          command serves the admin GUI from it. setup.ps1 copies it for you.

          Docs: https://github.com/VeeamHub/veeam-vhc-aws
          '@ | Set-Content release-bundle/README.txt
          $zip = "veeam-vhc-aws-${{ steps.version.outputs.tag }}-windows.zip"
          Compress-Archive -Path release-bundle/* -DestinationPath $zip
          Write-Host "--- Zip contents ---"
          [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path).Entries |
            Select-Object FullName, Length

      # --- VirusTotal scan (optional, requires VT_API_KEY secret) ---
      - name: Check VT API key configured
        id: vt_check
        shell: pwsh
        run: |
          if ($env:VT_API_KEY) {
            "has_key=true" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "::warning::VT_API_KEY secret not set — VirusTotal scan will be skipped."
          }
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}

      - name: VirusTotal Scan
        id: virustotal
        if: steps.vt_check.outputs.has_key == 'true'
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          $exe = "dist/win-x64/veeam-vhc-aws.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $vtUrl = "https://www.virustotal.com/gui/file/$hash"
          "vt_url=$vtUrl" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "VT report URL: $vtUrl"

          # VirusTotal caps direct /files uploads at 32 MB. The self-contained,
          # untrimmed win-x64 build is larger, so request a one-time upload URL
          # for big files. JSON parsing is defensive: an API error must warn and
          # let the release proceed, not throw. (curl.exe ships via Git for Windows.)
          $size = (Get-Item $exe).Length
          Write-Host "Artifact size: $size bytes"

          if ($size -gt 33554432) {
            Write-Host "File > 32 MB — requesting large-file upload URL"
            $urlJson = curl.exe -s --request GET `
              --url "https://www.virustotal.com/api/v3/files/upload_url" `
              --header "x-apikey: $env:VT_API_KEY"
            try { $uploadUrl = ($urlJson | ConvertFrom-Json).data } catch { $uploadUrl = $null }
            if (-not $uploadUrl) {
              Write-Host "::warning::Could not obtain VirusTotal upload URL — skipping scan. Report: $vtUrl"
              exit 0
            }
            $uploadJson = curl.exe -s --request POST `
              --url "$uploadUrl" `
              --header "x-apikey: $env:VT_API_KEY" `
              --form "file=@$exe"
          } else {
            $uploadJson = curl.exe -s --request POST `
              --url "https://www.virustotal.com/api/v3/files" `
              --header "x-apikey: $env:VT_API_KEY" `
              --form "file=@$exe"
          }

          try { $analysisId = ($uploadJson | ConvertFrom-Json).data.id } catch { $analysisId = $null }
          if (-not $analysisId) {
            Write-Host "::warning::VirusTotal upload returned no analysis id (API error or rate limit) — skipping scan. Report: $vtUrl"
            exit 0
          }
          Write-Host "Analysis ID: $analysisId"

          # Poll for results
          for ($i = 1; $i -le 20; $i++) {
            Start-Sleep -Seconds 30
            $resultJson = curl.exe -s --request GET `
              --url "https://www.virustotal.com/api/v3/analyses/$analysisId" `
              --header "x-apikey: $env:VT_API_KEY"
            try { $result = $resultJson | ConvertFrom-Json } catch { $result = $null }
            $status = $result.data.attributes.status
            Write-Host "[$i/20] Status: $status"
            if ($status -eq "completed") {
              $malicious = $result.data.attributes.stats.malicious
              "malicious=$malicious" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
              Write-Host "Malicious: $malicious | Report: $vtUrl"
              if ([int]$malicious -gt 5) {
                Write-Host "::error::VirusTotal flagged $malicious engines as malicious. Review: $vtUrl"
                exit 1
              }
              Write-Host "VT scan passed."
              exit 0
            }
          }
          Write-Host "::warning::VirusTotal analysis did not complete within 10 minutes — proceeding."

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $zip = "veeam-vhc-aws-$tag-windows.zip"

          gh release create $tag $zip `
            --title "veeam-vhc-aws $tag" `
            --generate-notes

          $vtUrl = "${{ steps.virustotal.outputs.vt_url }}"
          $vtCount = "${{ steps.virustotal.outputs.malicious }}"
          if ($vtUrl) {
            $current = gh release view $tag --json body -q .body
            $notes = "$current`n`n**VirusTotal scan:** $vtUrl ($vtCount malicious detections)`n"
            $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.txt"
            $notes | Out-File $notesFile -Encoding utf8
            gh release edit $tag --notes-file $notesFile
          }
