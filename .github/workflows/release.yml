name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  # Gate: run all validation before releasing
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v

  security:
    name: Security Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          pip install pip-audit bandit[toml] .
          pip freeze --exclude vhc-monitor --exclude pip-audit --exclude bandit > requirements-audit.txt

      - name: Dependency audit
        run: pip-audit --strict --desc -r requirements-audit.txt

      - name: Bandit SAST
        run: bandit -r vhc_monitor/ -f screen --skip B105,B107,B404,B603,B607

  # Build and release
  release:
    name: Build & Release
    runs-on: windows-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install .
          pip install pyinstaller

      - name: Set version
        id: version
        shell: bash
        run: |
          # Base version from code + run number for unique, auto-incrementing releases
          BASE=$(python -c "from vhc_monitor import __version__; print(__version__)")
          VERSION="${BASE}.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Build executable
        run: pyinstaller vhc-monitor.spec --noconfirm

      - name: Bundle release zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-bundle -Force | Out-Null
          Copy-Item dist/vhc-monitor.exe release-bundle/
          Copy-Item setup.ps1 release-bundle/
          Copy-Item config/example.yaml release-bundle/
          @"
          # vhc-monitor ${{ steps.version.outputs.tag }}

          ## Quick Start

          1. Run setup (creates config + scheduled task):

              .\setup.ps1 -AlertUrl "https://ntfy.example.com/veeam-alerts"

          2. Or manually configure:

              Copy example.yaml to vhc-monitor.yaml
              Edit with your server details
              .\vhc-monitor.exe all -c vhc-monitor.yaml

          ## First Time?

          Just double-click vhc-monitor.exe — it will guide you.

          ## Commands

              vhc-monitor.exe setup                        Create config file
              vhc-monitor.exe all -c vhc-monitor.yaml      Run all monitors
              vhc-monitor.exe test-connection -c config     Test server connectivity
              vhc-monitor.exe serve -c config -p 9100       Prometheus metrics server
              vhc-monitor.exe --help                        Show all commands

          ## Docs

          https://github.com/VeeamHub/veeam-vhc-monitor
          "@ | Out-File -FilePath release-bundle/README.txt -Encoding utf8
          Compress-Archive -Path release-bundle/* -DestinationPath "vhc-monitor-${{ steps.version.outputs.tag }}-windows.zip"

      - name: VirusTotal Scan
        id: virustotal
        if: env.VT_API_KEY != ''
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          # Submit file
          echo "Submitting dist/vhc-monitor.exe to VirusTotal..."
          UPLOAD=$(curl -s --request POST \
            --url https://www.virustotal.com/api/v3/files \
            --header "x-apikey: $VT_API_KEY" \
            --form file=@dist/vhc-monitor.exe)
          ANALYSIS_ID=$(echo "$UPLOAD" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['id'])")
          echo "Analysis ID: $ANALYSIS_ID"

          # Poll until complete (up to 10 min, 30s intervals)
          for i in $(seq 1 20); do
            sleep 30
            RESULT=$(curl -s --request GET \
              --url "https://www.virustotal.com/api/v3/analyses/$ANALYSIS_ID" \
              --header "x-apikey: $VT_API_KEY")
            STATUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['attributes']['status'])")
            echo "[$i/20] Status: $STATUS"
            if [ "$STATUS" = "completed" ]; then
              MALICIOUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['attributes']['stats']['malicious'])")
              SUSPICIOUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['attributes']['stats']['suspicious'])")
              SHA256=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin)['data']['attributes']; print(d.get('sha256',''))" 2>/dev/null || true)
              VT_URL="https://www.virustotal.com/gui/file/$SHA256"
              echo "Malicious: $MALICIOUS | Suspicious: $SUSPICIOUS"
              echo "vt_url=$VT_URL" >> "$GITHUB_OUTPUT"
              echo "malicious=$MALICIOUS" >> "$GITHUB_OUTPUT"
              # Threshold: >5 malicious = block release. PyInstaller FPs typically hit 2-4 engines.
              if [ "$MALICIOUS" -gt 5 ]; then
                echo "::error::VirusTotal flagged $MALICIOUS engines as malicious (threshold: 5). Review: $VT_URL"
                exit 1
              fi
              echo "VT scan passed ($MALICIOUS malicious detections). Report: $VT_URL"
              exit 0
            fi
          done
          echo "::warning::VirusTotal analysis did not complete within 10 minutes — proceeding anyway."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "vhc-monitor-${{ steps.version.outputs.tag }}-windows.zip" \
            dist/vhc-monitor.exe \
            --title "vhc-monitor ${{ steps.version.outputs.tag }}" \
            --generate-notes

          # Append VT scan link to release notes using a temp file to avoid YAML/shell quoting issues
          VT_URL="${{ steps.virustotal.outputs.vt_url }}"
          VT_COUNT="${{ steps.virustotal.outputs.malicious }}"
          if [ -n "$VT_URL" ]; then
            CURRENT_NOTES=$(gh release view "${{ steps.version.outputs.tag }}" --json body -q .body)
            printf '%s\n\nVirusTotal scan: %s (%s malicious detections)\n' \
              "$CURRENT_NOTES" "$VT_URL" "$VT_COUNT" > /tmp/release-notes.txt
            gh release edit "${{ steps.version.outputs.tag }}" --notes-file /tmp/release-notes.txt
          fi
