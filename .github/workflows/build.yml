name: Build & Test

on:
  push:
    branches: [dev]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore src/VeeamVhcAws/VeeamVhcAws.csproj

      - name: Build
        run: dotnet build src/VeeamVhcAws/VeeamVhcAws.csproj --no-restore -c Release

      - name: Test
        run: dotnet test tests/VeeamVhcAws.Tests/VeeamVhcAws.Tests.csproj --no-build -c Release -v normal

  build-exe:
    name: Build win-x64 & VT Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish win-x64
        run: |
          dotnet publish src/VeeamVhcAws/VeeamVhcAws.csproj \
            -c Release \
            -r win-x64 \
            --self-contained \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o dist/win-x64 \
            --nologo

      - name: Verify single-file output
        run: |
          ls -lh dist/win-x64/
          test -f dist/win-x64/veeam-vhc-aws.exe || (echo "ERROR: veeam-vhc-aws.exe not found" && exit 1)
          COUNT=$(ls dist/win-x64/ | wc -l)
          echo "Output file count: $COUNT"

      - name: VirusTotal Scan
        if: env.VT_API_KEY != ''
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          SHA256=$(sha256sum dist/win-x64/veeam-vhc-aws.exe | awk '{print $1}')
          VT_URL="https://www.virustotal.com/gui/file/$SHA256"
          echo "VT report URL: $VT_URL"

          UPLOAD=$(curl -s --request POST \
            --url https://www.virustotal.com/api/v3/files \
            --header "x-apikey: $VT_API_KEY" \
            --form file=@dist/win-x64/veeam-vhc-aws.exe)
          ANALYSIS_ID=$(echo "$UPLOAD" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['id'])")
          echo "Analysis ID: $ANALYSIS_ID"

          for i in $(seq 1 20); do
            sleep 30
            RESULT=$(curl -s --request GET \
              --url "https://www.virustotal.com/api/v3/analyses/$ANALYSIS_ID" \
              --header "x-apikey: $VT_API_KEY")
            STATUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['attributes']['status'])")
            echo "[$i/20] Status: $STATUS"
            if [ "$STATUS" = "completed" ]; then
              MALICIOUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['attributes']['stats']['malicious'])")
              echo "Malicious: $MALICIOUS | Report: $VT_URL"
              if [ "$MALICIOUS" -gt 5 ]; then
                echo "::error::VirusTotal flagged $MALICIOUS engines as malicious (threshold: 5). Review: $VT_URL"
                exit 1
              fi
              echo "VT scan passed."
              exit 0
            fi
          done
          echo "::warning::VirusTotal analysis did not complete within 10 minutes."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: veeam-vhc-aws-win-x64
          path: dist/win-x64/veeam-vhc-aws.exe
