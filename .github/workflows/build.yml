name: Build & Test

on:
  push:
    branches: [dev]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v

  build-exe:
    name: Build & VT Scan
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install .
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller vhc-monitor.spec --noconfirm

      - name: VirusTotal Scan
        if: env.VT_API_KEY != ''
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          # Compute SHA256 locally — use this for the VT report URL
          SHA256=$(sha256sum dist/vhc-monitor.exe | awk '{print $1}')
          VT_URL="https://www.virustotal.com/gui/file/$SHA256"
          echo "VT report URL: $VT_URL"

          # Submit file
          echo "Submitting dist/vhc-monitor.exe to VirusTotal..."
          UPLOAD=$(curl -s --request POST \
            --url https://www.virustotal.com/api/v3/files \
            --header "x-apikey: $VT_API_KEY" \
            --form file=@dist/vhc-monitor.exe)
          ANALYSIS_ID=$(echo "$UPLOAD" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['id'])")
          echo "Analysis ID: $ANALYSIS_ID"

          # Poll until complete (up to 10 min, 30s intervals)
          for i in $(seq 1 20); do
            sleep 30
            RESULT=$(curl -s --request GET \
              --url "https://www.virustotal.com/api/v3/analyses/$ANALYSIS_ID" \
              --header "x-apikey: $VT_API_KEY")
            STATUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['attributes']['status'])")
            echo "[$i/20] Status: $STATUS"
            if [ "$STATUS" = "completed" ]; then
              MALICIOUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['attributes']['stats']['malicious'])")
              SUSPICIOUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['attributes']['stats']['suspicious'])")
              echo "Malicious: $MALICIOUS | Suspicious: $SUSPICIOUS"
              echo "Report: $VT_URL"
              if [ "$MALICIOUS" -gt 5 ]; then
                echo "::error::VirusTotal flagged $MALICIOUS engines as malicious (threshold: 5). Review: $VT_URL"
                exit 1
              fi
              echo "VT scan passed ($MALICIOUS malicious detections)."
              exit 0
            fi
          done
          echo "::warning::VirusTotal analysis did not complete within 10 minutes."

      - name: Upload executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: vhc-monitor-windows
          path: dist/vhc-monitor.exe
